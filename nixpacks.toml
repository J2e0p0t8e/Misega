[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs"]

[phases.build]
cmds = [
    "mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache bootstrap/cache",
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build"
]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host 0.0.0.0 --port $PORT"
